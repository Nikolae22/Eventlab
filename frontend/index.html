<!doctype html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventLab - Piattaforma Eventi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col justify-between">

<!-- Header / Navbar -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white font-bold p-2 rounded-xl shadow-md shadow-indigo-100">
                EL
            </div>
            <div>
                <h1 class="text-lg font-bold text-slate-900 leading-tight">EventLab</h1>
                <p class="text-xs text-slate-500">Gestione Eventi & Prenotazioni</p>
            </div>
        </div>
        <button onclick="toggleAreaOperatore()" class="inline-flex items-center px-4 py-2
        bg-slate-900 hover:bg-indigo-600 text-white text-xs font-semibold rounded-xl
         transition-all duration-200 shadow-sm">
            🔒 Area Operatore
        </button>
    </div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">

    <!-- Box Messaggi -->
    <div id="messaggio" class="hidden mb-6 p-4 rounded-xl text-sm font-medium shadow-sm
     transition-all duration-300"
         role="alert"></div>

    <!-- SEZIONE OPERATORE (Nascosta di default) -->
    <div id="sezioneOperatore" class="hidden mb-8 bg-white border border-slate-200 rounded-2xl p-6
     shadow-xl shadow-slate-100">
        <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
            <div>
                <h2 class="text-base font-bold text-slate-800">Pubblica Nuovo Evento</h2>
                <p class="text-xs text-slate-500">Inserisci i dettagli dell'incontro</p>
            </div>
            <button onclick="toggleAreaOperatore()" class="text-slate-400 hover:text-slate-600
            text-sm font-semibold">✕ Chiudi</button>
        </div>
        <form id="form-nuovo-evento" onsubmit="creaEvento(event)" class="grid grid-cols-1
         sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Titolo Evento</label>
                <input class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl
                text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                       name="titolo"
                       placeholder="Es. Workshop Java 21"
                       required maxlength="100">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Luogo / Link</label>
                <input class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl
                text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                       name="luogo"
                       placeholder="Es. Aula Magna / Online">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Data e Ora</label>
                <input class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl
                text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                       name="dataEvento"
                       type="datetime-local" required>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Capienza Massima</label>
                <input class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl
                 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                       name="capienzaMassima"
                       type="number"
                       placeholder="Es. 30"
                       min="1"
                       required>
            </div>
            <div class="sm:col-span-2">
                <label class="block text-xs font-semibold text-slate-600 mb-1">Descrizione</label>
                <textarea class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl
                text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                          name="descrizione"
                          placeholder="Descrivi brevemente l'evento..."
                          rows="2"></textarea>
            </div>
            <div class="sm:col-span-2">
                <button class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white
                text-sm font-semibold rounded-xl transition-colors shadow-md shadow-indigo-100"
                        type="submit">
                    Conferma e Pubblica Evento
                </button>
            </div>
        </form>
    </div>

    <!-- BARRA DI RICERCA E FILTRI -->
    <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-8 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
        <div>
            <h2 class="text-lg font-bold text-slate-800">Eventi in Programma</h2>
            <p class="text-xs text-slate-500">Esplora e prenota il tuo posto gratuitamente</p>
        </div>

        <!-- Contenitore flessibile per mettere i campi uno di fianco all'altro -->
        <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
            <!-- Input di ricerca per testo -->
            <input type="text" id="inputRicerca" oninput="filtraEventi()" placeholder="🔍 Cerca titolo o luogo..."
                   class="px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all flex-grow sm:flex-grow-0">

            <!-- Filtro Data Inizio -->
            <input type="date" id="filtroDataDa" onchange="filtraEventi()"
                   class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-600">

            <!-- Filtro Data Fine -->
            <input type="date" id="filtroDataA" onchange="filtraEventi()"
                   class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-600">
        </div>
    </div>

    <!-- GRIGLIA DEGLI EVENTI -->
    <div id="eventi" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Caricato dinamicamente -->
    </div>
</main>

<!-- MODAL PARTECIPANTI -->
<div id="modalPartecipanti" class="hidden fixed inset-0 z-50 overflow-y-auto bg-slate-900/40
backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100
    transform transition-all">
        <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
            <div>
                <h3 class="text-base font-bold text-slate-900">Elenco Partecipanti</h3>
                <p class="text-xs text-slate-500">Gestisci le prenotazioni attive per questo evento</p>
            </div>
            <button onclick="chiudiModal()" class="text-slate-400 hover:text-slate-600
            text-lg font-bold px-2">✕</button>
        </div>
        <div id="contenutoModalPartecipanti" class="max-h-80 overflow-y-auto divide-y
         divide-slate-100 pr-1">
            <!-- Lista inserita dinamicamente -->
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="bg-white border-t border-slate-200 py-4 mt-12 text-center text-xs text-slate-400">
    EventLab • Project Work Java & Spring Boot
</footer>

<!-- Script principale -->
<script src="app.js"></script>
</body>
</html>
