spring:
  application:
    name: event-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:eventlab_events}
    username: ${MYSQL_USER:eventlab}
    password: ${MYSQL_PASSWORD:we}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8081

 # credenziali per poter modificare e elimianre un evento  per sprign security
app:
  operatore:
    username: ${OPERATOR_USERNAME:operatore}
    password: ${OPERATOR_PASSWORD:test1234}